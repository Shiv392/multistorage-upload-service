spring.application.name=backend

server.port=8080

# base path of the application
server.servlet.context-path=/api

app.storage.upload-dir = uploads

# Disable AWS Secrets Manager lookup during tests
# spring.cloud.aws.secretsmanager.enabled=false

# Get secrets from AWS Secrets Manager with store name prod/linkdlyst 
# AWS Secrets Manager
spring.config.import=aws-secretsmanager:prod/multistorage-upload-service

# Bucket name from aws 
app.aws.s3.bucket-name=bucket-multistorage-upload

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Minimum number of idle connections maintained by HikariCP in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum number of connections (both idle and in-use) in the pool
spring.datasource.hikari.maximum-pool-size=20

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
